name: Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a release manually'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    name: Run bats tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Install bats
        run: |
          if [ -d tests/lib/bats-core ]; then
            echo "Using vendored bats-core"
            export PATH="$PWD/tests/lib/bats-core/bin:$PATH"
          else
            sudo apt-get update && sudo apt-get install -y bats
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Registry drift guard
        run: |
          echo "Checking deploy/registry.json is in sync with agent/skill frontmatter..."
          node deploy/build-registry.mjs --check

      - name: Lint .mjs + package.json + npx tarball guard
        run: |
          echo "Syntax-checking .mjs files..."
          node --check deploy/init.mjs deploy/source.mjs
          echo "Validating package.json..."
          jq . package.json
          echo "Checking npx tarball includes source tree..."
          npm pack --dry-run 2>&1 | grep -q "opencode_app/.opencode/" \
            && echo "source tree in tarball ✓" \
            || { echo "FAIL: opencode_app/.opencode/ missing from tarball"; exit 1; }

      - name: Run tests
        run: |
          export PATH="$PWD/tests/lib/bats-core/bin:$PATH"
          for f in tests/*.bats; do
            echo "=== Running $f ==="
            bats "$f" || exit 1
          done

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lint validation
        run: |
          echo "Validating opencode_app/opencode.json..."
          jq . opencode_app/opencode.json
          echo "opencode.json is valid"

          echo "Validating deploy/setup.sh syntax..."
          bash -n deploy/setup.sh
          echo "setup.sh syntax is valid"
        continue-on-error: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install semantic-release plugins
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/changelog \
            @semantic-release/exec \
            @semantic-release/git \
            @semantic-release/github \
            conventional-changelog-conventionalcommits

      - name: Create Release with CHANGELOG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Running semantic-release..."
          echo "📝 This will:"
          echo "   1. Analyze commits to determine version bump"
          echo "   2. Update VERSION file with new version"
          echo "   3. Update CHANGELOG.md with release notes"
          echo "   4. Create git tag (vX.Y.Z)"
          echo "   5. Create GitHub release"
          echo ""
          npx semantic-release

      - name: Upload CHANGELOG as workflow artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CHANGELOG
          path: CHANGELOG.md
          retention-days: 30
