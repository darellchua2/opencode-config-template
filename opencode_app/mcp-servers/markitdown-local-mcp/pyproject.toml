[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markitdown-local-mcp"
version = "0.1.0"
description = "Privacy-hardened MCP wrapper around markitdown. Local-only converters, stdio-only transport, no cloud/telemetry paths."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "opencode-config-template contributors" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Topic :: Security",
]
# Constrained deps — PRIVACY TRUST BOUNDARY.
# - markitdown is pinned with: (a) only local converter extras, (b) version cap matching upstream.
# - mcp version matches upstream's pin.
# - NO starlette/uvicorn: stdio-only transport, no HTTP listener surface.
#
# Explicitly EXCLUDED (would be pulled in by markitdown[all]):
#   - markitdown[az-doc-intel]        -> azure-ai-documentintelligence (cloud upload)
#   - markitdown[az-content-understanding] -> azure-ai-contentunderstanding (cloud upload)
#   - markitdown[audio-transcription] -> SpeechRecognition (Google Speech API)
#   - markitdown[youtube-transcription] -> youtube-transcript-api (YouTube contact)
#   - markitdown[all]                 -> superset of all above + azure-identity
#
# A version bump above <0.2 requires explicit review per the README's pin policy.
dependencies = [
  "mcp>=1.8.0,<2.0",
  "markitdown[pdf,docx,pptx,xlsx,xls,outlook]>=0.1.1,<0.2.0",
]

[project.urls]
Documentation = "https://github.com/darellchua2/opencode-config-template/blob/main/opencode_app/mcp-servers/markitdown-local-mcp/README.md"
Issues = "https://github.com/darellchua2/opencode-config-template/issues"
Source = "https://github.com/darellchua2/opencode-config-template/tree/main/opencode_app/mcp-servers/markitdown-local-mcp"
Upstream = "https://github.com/microsoft/markitdown"

[project.scripts]
markitdown-local-mcp = "markitdown_local_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/markitdown_local_mcp"]
